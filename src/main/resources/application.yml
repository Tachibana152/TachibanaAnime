server:
  port: 8080

spring:
  application:
    name: ProjectSekai-05
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/mydatabase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 文件上传配置
file:
  upload-dir: uploads/

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.tachibana.projectsekai05.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（生产环境务必替换 secret）
jwt:
  secret: ce80f305a644248fc36393ba3d725b85998285020adc269face4052f00592974ca0de6e0b79e70b36c57a769b81449e6
  expiration: 7200
  header: Authorization
  prefix: "Bearer "

# RSA 签名配置（可用 RsaKeyGenerator.main() 重新生成密钥对）
sign:
  private-key: 
  public-key: 
  algorithm: SHA256withRSA
  enabled: false

# 安全：是否启用 Redis 会话校验（true=JWT+Redis 双校验，false=仅 JWT）
security:
  redis-session:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs